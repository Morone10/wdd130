<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questionário HTML e CSS</title>
    <link rel="stylesheet" href="estilos/questionario.css">
</head>
<body>

    <main>
        <h1>Questionário sobre HTML e CSS</h1>

        <form>

            <label for="q1">
                1. Qual tag HTML é utilizada para criar um hiperlink?
            </label>
            <input type="text" id="q1" name="q1">

            <label for="q2">
                2. Explique, com suas palavras, qual é a função do CSS em uma página web.
            </label>
            <textarea id="q2" name="q2" rows="5"></textarea>

            <label for="q3">
                3. Qual propriedade CSS é usada para alterar a cor do texto?
            </label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Escolha uma...</option>
                <option value="color">color</option>
                <option value="background-color">background-color</option>
                <option value="font-size">font-size</option>
            </select>

            <label for="q4">
                4. Quantos níveis de títulos existem no HTML (h1 até h6)?
            </label>
            <input type="number" id="q4" name="q4" min="1" max="6">

            <button type="submit">Enviar Questionário</button>

        </form>
    </main>

</body>
</html>
