
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="estilos/formulario-pesquisa.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Pesquisa</title>
</head>
<body>

    <header>
        <h1>Pesquisa de Usuário</h1>
    </header>

    <main>
        <form action="#" method="post">

        <div class="item-formulario coluna2">
            <label for="nome-completo">Nome Completo:</label><br>
            <input type="text" id="nome-completo" name="nome-completo" required>
            <br><br>
        </div>
        
        <div class="item-formulario coluna2">
            <label for="emaildousuario">E-mail:</label><br>
            <input type="email" id="emaildousuario" name="emaildousuario" required>
            <br><br>
        </div>

        <div class="coluna1">    
            <label for="navegador">Qual é o seu navegador favorito?</label><br>
            <select id="navegador" name="navegador">
                <option value="chrome">Chrome</option>
                <option value="firefox">Firefox</option>
                <option value="edge">Edge</option>
                <option value="brave">Brave</option>
                <option value="safari">Safari</option>
                <option value="outro">Outro</option>
            </select>
            <br><br>
        </div>
        <div class="coluna1">
            <label for="pet">Você tem um bichinho de estimação em casa?</label>
            <input type="checkbox" id="pet" name="pet">
            <br><br>
        </div>
        
            <label for="feedback">Liste os lugares onde você morou:</label><br>
            <textarea
                id="feedback"
                name="feedback"
                rows="4"
                placeholder="Ex.: Sobral - CE, Fortaleza - CE, São Paulo - SP">
            </textarea>
            <br><br>
        
            
            <button type="submit">Enviar Pesquisa</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 - Formulário de Pesquisa</p>
    </footer>

</body>
</html>
